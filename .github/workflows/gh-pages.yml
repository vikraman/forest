name: Build forest and deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - name: Setup TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-full
      - name: Check `latex`
        run: |
          echo $GITHUB_PATH
          tlmgr --version
          latex --version
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - name: Install forester
        run: |
          opam pin add forester git+https://git.sr.ht/~jonsterling/ocaml-forester#4beb9d2af6c893847c5f5483617a0b2e89fef728 --yes
          opam install forester --yes
      - name: Build with forester
        run: |
          eval $(opam env)
          opam exec -- forester --version
          make
      - name: Fix permissions
        run: |
          chmod -c -R +rX "./output/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: output
          path: ./output
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          cname: forest.vikraman.org
